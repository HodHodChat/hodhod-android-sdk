name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK packages
        run: |
          # ubuntu-latest ships the Android SDK; just make sure the needed platform is present
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :hodhod-core:testDebugUnitTest :hodhod-ui:testDebugUnitTest
      - name: Build sample and library AARs
        run: ./gradlew :sample:assembleDebug :hodhod-core:assembleRelease :hodhod-ui:assembleRelease
      - name: Verify publication (same task JitPack runs)
        run: ./gradlew -Pversion=ci-snapshot :hodhod-core:publishReleasePublicationToMavenLocal :hodhod-ui:publishReleasePublicationToMavenLocal -x test
